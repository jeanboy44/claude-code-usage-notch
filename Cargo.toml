[package]
name = "notchi-usage"
version = "0.1.0"
edition = "2021"
description = "A tiny, cute Claude usage meter living in the MacBook notch"

[dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std", "block2", "NSArray", "NSDate", "NSDateFormatter", "NSDictionary", "NSEnumerator",
    "NSFormatter", "NSGeometry", "NSLocale", "NSNotification", "NSObject", "NSOperation", "NSString",
    "NSTimeZone", "NSTimer", "NSURL", "NSValue",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std", "objc2-core-foundation", "NSAccessibility", "NSAccessibilityConstants",
    "NSAccessibilityProtocols", "NSApplication", "NSAttributedString", "NSBezierPath", "NSColor",
    "NSEvent", "NSFont", "NSFontDescriptor", "NSGraphics", "NSMenu", "NSMenuItem", "NSPanel", "NSResponder",
    "NSRunningApplication", "NSScreen", "NSStringDrawing", "NSTrackingArea", "NSView", "NSWindow",
    "NSWorkspace",
] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
