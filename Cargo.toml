[package]
name = "notchi-usage"
version = "0.1.0"
edition = "2021"
description = "A tiny, cute Claude usage meter living in the MacBook notch"

[dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
