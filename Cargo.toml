[package]
name = "notchi-usage"
version = "0.2.3"
edition = "2021"
description = "A tiny, cute Claude usage meter living in the MacBook notch"

[dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std", "block2", "NSArray", "NSDate", "NSDateFormatter", "NSDictionary", "NSEnumerator",
    "NSFormatter", "NSGeometry", "NSLocale", "NSNotification", "NSObject", "NSOperation", "NSAffineTransform", "NSData", "NSString",
    "NSTimeZone", "NSTimer", "NSURL", "NSValue",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std", "objc2-core-foundation", "NSAccessibility", "NSAccessibilityConstants",
    "NSAccessibilityProtocols", "NSApplication", "NSAttributedString", "NSBezierPath", "NSColor",
    "NSEvent", "NSFont", "NSFontDescriptor", "NSGraphics", "NSMenu", "NSMenuItem", "NSPanel", "NSResponder",
    "NSRunningApplication", "NSScreen", "NSStringDrawing", "NSTrackingArea", "NSView", "NSWindow",
    "NSWorkspace", "NSAnimation", "NSAffineTransform", "NSGraphicsContext", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSCell", "objc2-quartz-core", "objc2-core-graphics",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = [
    "std", "objc2-core-foundation", "objc2-core-graphics", "CALayer", "CAShapeLayer",
    "CAAnimation", "CAMediaTiming", "CAMediaTimingFunction", "CATransaction", "CABase",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGPath", "CGColor"] }
serde_json = "1"
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "objc2", "SMAppService", "objc2-foundation"] }
aes = "0.8"
cbc = "0.1"
pbkdf2 = "0.12"
sha1 = "0.10"
security-framework = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
